apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-notifications
  namespace: argocd
spec:
  project: monitoring

  source:
    repoURL: https://github.com/el7-7/poc-gitops-monitoring.git
    targetRevision: main
    path: apps/argocd-notifications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
